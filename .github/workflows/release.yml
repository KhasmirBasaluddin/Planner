name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare build configuration
        shell: pwsh
        run: Copy-Item .env.example .env

      # The version comes from the tag (v1.2.0 -> 1.2.0) and is stamped into
      # the executable, the installer, and the artifact names. The in-app
      # updater compares the executable's version against the latest release
      # tag, so all of these have to agree.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)'
            $version = $match.Matches[0].Groups[1].Value.Split('+')[0]
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Windows app
        run: >-
          flutter build windows --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer\Planner.iss

      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Planner-Portable-${{ steps.version.outputs.version }}.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PlannerSetup-*.exe
            dist/Planner-Portable-*.zip
