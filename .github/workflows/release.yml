name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Checked before anything is built, because the failure it prevents is
      # silent: without credentials the app still compiles, installs and
      # launches, and only then shows the "Supabase setup required" screen —
      # by which point it is already published and people have downloaded it.
      - name: Check release credentials
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) {
            $missing += 'SUPABASE_URL'
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            $missing += 'SUPABASE_ANON_KEY'
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing repository secret(s): $($missing -join ', '). Add them under Settings -> Secrets and variables -> Actions, then re-run. Without them the published build cannot reach Supabase."
            exit 1
          }
          Write-Host "Supabase credentials present."

      # An empty .env, not a copy of .env.example.
      #
      # The file has to exist — it is declared as an asset, and a missing
      # asset fails the build — but its contents must not. Copying the example
      # shipped `your-project-ref` placeholders inside the binary, one
      # precedence rule away from being read as real configuration.
      - name: Prepare build configuration
        shell: pwsh
        run: New-Item -ItemType File -Path .env -Force | Out-Null

      # The version comes from the tag (v1.2.0 -> 1.2.0) and is stamped into
      # the executable, the installer, and the artifact names. The in-app
      # updater compares the executable's version against the latest release
      # tag, so all of these have to agree.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)'
            $version = $match.Matches[0].Groups[1].Value.Split('+')[0]
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Windows app
        run: >-
          flutter build windows --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # Belt and braces: confirm the credentials actually reached the binary.
      # A --dart-define that silently failed to apply looks exactly like a
      # successful build until someone installs it.
      - name: Verify the build is configured
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          $exe = 'build\windows\x64\runner\Release\planner.exe'
          $data = 'build\windows\x64\runner\Release\data\app.so'
          $host_ = ([uri]$env:SUPABASE_URL).Host
          $found = $false
          foreach ($file in @($exe, $data)) {
            if (Test-Path $file) {
              $bytes = [IO.File]::ReadAllBytes($file)
              $text = [Text.Encoding]::ASCII.GetString($bytes)
              if ($text.Contains($host_)) { $found = $true; break }
            }
          }
          if (-not $found) {
            Write-Host "::error::The built app does not contain the Supabase URL. The --dart-define values did not reach the binary, so this build would ship unconfigured."
            exit 1
          }
          Write-Host "Build carries the Supabase configuration."

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer\Planner.iss

      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Planner-Portable-${{ steps.version.outputs.version }}.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PlannerSetup-*.exe
            dist/Planner-Portable-*.zip
