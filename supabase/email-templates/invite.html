<!--
  Supabase → Authentication → Email Templates → "Invite user"

  Same paper stock, violet margin rule.

  Note: this fires only for invitations sent through Supabase's own
  auth.admin.inviteUserByEmail API. The in-app "Members & invites" flow does
  NOT use it — that writes a row to workspace_invites which is claimed silently
  when the person next signs in. Wiring in-app invites to actually send mail
  needs an Edge Function; see supabase/email-setup.md.

  See confirm-signup.html for the dark-mode and Outlook/VML notes.
-->
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  /* Apple Mail, iOS Mail, and Outlook macOS. */
  @media (prefers-color-scheme: dark) {
    .p-bg    { background-color: #1b1a18 !important; }
    .p-paper { background-color: #26241f !important; }
    .p-head  { color: #f2ede1 !important; }
    .p-body  { color: #ded8c9 !important; }
    .p-quiet { color: #9a9282 !important; }
    .p-rule  { border-color: #3b3831 !important; }
    .p-link  { color: #e08b6f !important; }
    /* The anchor keeps its own dark fill, so it stays a button rather than
       being flattened into the background. */
    .p-btn   { background-color: #e8e3d6 !important; }
    .p-btn a { color: #22211e !important; }
  }

  /* Outlook.com and Outlook for Android rewrite colours instead of filtering,
     so they need their own hooks. */
  [data-ogsc] .p-bg    { background-color: #1b1a18 !important; }
  [data-ogsb] .p-paper { background-color: #26241f !important; }
  [data-ogsc] .p-head  { color: #f2ede1 !important; }
  [data-ogsc] .p-body  { color: #ded8c9 !important; }
  [data-ogsc] .p-quiet { color: #9a9282 !important; }
  [data-ogsc] .p-link  { color: #e08b6f !important; }
  [data-ogsb] .p-btn   { background-color: #e8e3d6 !important; }
  [data-ogsc] .p-btn a { color: #22211e !important; }

  @media only screen and (max-width: 520px) {
    .p-pad  { padding-right: 20px !important; }
    .p-gut  { width: 16px !important; }
    .p-h1   { font-size: 27px !important; line-height: 31px !important; }
  }
</style>

<table class="p-bg" width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color:#d9d5cc;margin:0;padding:36px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">

      <table class="p-paper" width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="max-width:540px;background-color:#faf7f0;">
        <tr>

          <td width="2" style="background-color:#6b52c4;font-size:0;line-height:0;">&nbsp;</td>
          <td class="p-gut" width="26" style="font-size:0;line-height:0;">&nbsp;</td>

          <td class="p-pad" style="padding:0 30px 0 0;">

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr>
                <td class="p-rule" style="padding:26px 0 12px 0;border-bottom:1px solid #e2ddd1;">
                  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
                    <tr>
                      <td style="vertical-align:middle;">
                        <span class="p-head" style="color:#2b2a27;font-size:14px;font-weight:700;letter-spacing:-0.2px;">Planner</span>
                      </td>
                      <td align="right" style="vertical-align:middle;">
                        <span class="p-quiet" style="color:#a39c8c;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;">Invitation</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr>
                <td style="padding:34px 0 0 0;">
                  <h1 class="p-h1 p-head" style="margin:0;color:#22211e;font-size:34px;font-weight:700;letter-spacing:-1.4px;mso-line-height-rule:exactly;line-height:38px;">
                    You’ve got a<br>seat at the table.
                  </h1>
                </td>
              </tr>
            </table>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin-top:20px;">
              <tr>
                <td class="p-rule p-body" height="30" style="border-bottom:1px solid #e8e3d6;color:#4f4b42;font-size:14.5px;mso-line-height-rule:exactly;line-height:30px;vertical-align:bottom;">
                  Someone added you to their workspace.
                </td>
              </tr>
              <tr>
                <td class="p-rule p-body" height="30" style="border-bottom:1px solid #e8e3d6;color:#4f4b42;font-size:14.5px;mso-line-height-rule:exactly;line-height:30px;vertical-align:bottom;">
                  Accept to see what the team is working on.
                </td>
              </tr>
              <tr>
                <td class="p-rule" height="30" style="border-bottom:1px solid #e8e3d6;font-size:0;line-height:30px;">&nbsp;</td>
              </tr>
            </table>

            <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin-top:26px;">
              <tr>
                <td>
                  <!--[if mso]>
                  <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                               href="{{ .ConfirmationURL }}"
                               style="height:44px;v-text-anchor:middle;width:185px;" arcsize="12%" stroke="f" fillcolor="#22211e">
                    <w:anchorlock/>
                    <center style="color:#faf7f0;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:600;">Accept invitation</center>
                  </v:roundrect>
                  <![endif]-->
                  <!--[if !mso]><!-- -->
                  <table class="p-btn" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color:#22211e;border-radius:5px;">
                    <tr>
                      <td>
                        <a href="{{ .ConfirmationURL }}"
                           style="display:inline-block;padding:13px 24px;color:#faf7f0;font-size:14px;font-weight:600;text-decoration:none;letter-spacing:-0.1px;mso-line-height-rule:exactly;line-height:16px;">
                          Accept invitation
                        </a>
                      </td>
                    </tr>
                  </table>
                  <!--<![endif]-->
                </td>
              </tr>
            </table>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin-top:30px;">
              <tr>
                <td class="p-rule" style="border-top:1px solid #e8e3d6;padding-top:16px;">
                  <p class="p-quiet" style="margin:0;color:#8f887a;font-size:11.5px;mso-line-height-rule:exactly;line-height:17px;">
                    Button not working? Paste this link into your browser:
                  </p>
                  <p style="margin:4px 0 0 0;word-break:break-all;">
                    <a class="p-link" href="{{ .ConfirmationURL }}" style="color:#a5573f;font-size:11.5px;text-decoration:none;mso-line-height-rule:exactly;line-height:17px;">{{ .ConfirmationURL }}</a>
                  </p>
                  <p class="p-quiet" style="margin:14px 0 0 0;color:#a8a294;font-size:11.5px;mso-line-height-rule:exactly;line-height:17px;">
                    Not expecting this? You can safely ignore it.
                  </p>
                </td>
              </tr>
            </table>

            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr><td height="30" style="font-size:0;line-height:30px;">&nbsp;</td></tr>
            </table>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
